name: push-ghcr-images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to use (e.g. dev6fv6)
        required: true
        type: string

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  TARGET_ARCH: amd64
  HOST_ARCH: amd64
  GOOS: linux

jobs:
  prepare-runner-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Build kernel for runner
        env:
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          HOST_ARCH: ${{ env.HOST_ARCH }}
        run: make kernel TARGET_ARCH=$TARGET_ARCH HOST_ARCH=$HOST_ARCH

      - name: Download firmware and prebuild runner image
        env:
          TARGET_ARCH: ${{ env.TARGET_ARCH }}
          GOOS: ${{ env.GOOS }}
        run: |
          make download-qemu-bios TARGET_ARCH=$TARGET_ARCH GOOS=$GOOS
          mkdir -p neonvm-runner/external-firmware/${TARGET_ARCH}-${GOOS}
          make docker-build-runner TARGET_ARCH=$TARGET_ARCH GOOS=$GOOS

      - name: Upload runner prerequisites
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: runner-prereqs-${{ env.TARGET_ARCH }}
          path: |
            neonvm-kernel/vmlinuz-${{ env.TARGET_ARCH }}
            neonvm-runner/external-firmware/${{ env.TARGET_ARCH }}-${{ env.GOOS }}
          if-no-files-found: error

  build-and-push:
    needs: prepare-runner-assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: neonvm-controller
            make_target: docker-build-controller
            env_var: IMG_CONTROLLER
          - image_name: neonvm-runner
            make_target: docker-build-runner
            env_var: IMG_RUNNER
          - image_name: autoscale-scheduler
            make_target: docker-build-scheduler
            env_var: IMG_SCHEDULER
          - image_name: autoscaler-agent
            make_target: docker-build-autoscaler-agent
            env_var: IMG_AUTOSCALER_AGENT
          - image_name: neonvm-vxlan-controller
            make_target: docker-build-vxlan-controller
            env_var: IMG_VXLAN_CONTROLLER

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download runner prerequisites
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: runner-prereqs-${{ env.TARGET_ARCH }}
          path: .

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: |
            ghcr.io/${{ github.repository }}/${{ matrix.image_name }}
            docker.io/simplyblock/autoscaling
          tags: |
            type=ref,event=branch,prefix=${{ matrix.image_name }}-
            type=ref,event=pr,prefix=${{ matrix.image_name }}-
            type=sha,prefix=${{ matrix.image_name }}-main-,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }},prefix=${{ matrix.image_name }}-

      - name: Show target tags
        run: |
          echo "Image: ghcr.io/${GITHUB_REPOSITORY}/${{ matrix.image_name }}"
          echo "Tags:"
          echo '${{ steps.meta.outputs.tags }}'

      - name: Build image
        run: |
          PRIMARY_TAG="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          make ${{ matrix.make_target }} ${{ matrix.env_var }}="$PRIMARY_TAG"
          echo '${{ steps.meta.outputs.tags }}' | tail -n +2 | while read -r tag; do
            [[ -z "$tag" ]] && continue
            docker tag "$PRIMARY_TAG" "$tag"
          done

      - name: Push image
        run: |
          echo '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            [[ -z "$tag" ]] && continue
            docker push "$tag"
          done
