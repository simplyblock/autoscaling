# RBAC for the neonvm-runner ServiceAccount.
# The runner pod needs permission to create Kubernetes Events so it can signal
# guest filesystem resize completion to the control plane.
# The ServiceAccount, Role, and RoleBinding must exist in every namespace
# where VMs run.  Namespace is set via kustomize patches in kustomization.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neonvm-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: neonvm-runner
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: neonvm-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: neonvm-runner
subjects:
- kind: ServiceAccount
  name: neonvm-runner
