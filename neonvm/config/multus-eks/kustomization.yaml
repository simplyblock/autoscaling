apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


images:
- name: multus-cni
  newName: public.ecr.aws/eks/multus-cni
  newTag: v3.9.2-eksbuild.1


patches:
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/command
      value: ["/entrypoint.sh"]
    - op: replace
      path: /spec/template/spec/containers/0/args
      value:
        - "--multus-conf-file=auto"
        - "--cni-version=0.4.0"
        - "--multus-master-cni-file-name=10-aws.conflist"
        - "--multus-log-level=error"
        - "--multus-log-file=/var/log/aws-routed-eni/multus.log"
  target:
    kind: DaemonSet
    name: kube-multus-ds
- path: daemonset_patch.yaml
resources:
- ../multus-common
